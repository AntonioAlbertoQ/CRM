<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- 1. Metadados: idioma, codificação, escala da tela e título da página -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect System | Login E Cadastro</title>

    <!-- 2. Arquivos externos de apresentação e comportamento -->
    <link rel="stylesheet" href="./assets/login/css/style.css">
    <script type="module" src="./assets/login/js/main.js"></script>
</head>
<body>
    <!-- 3. Fundo decorativo: orbes posicionados atrás do conteúdo principal -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- 4. Região onde o JavaScript insere notificações temporárias (toasts) -->
    <div id="toast-container"></div>

    <!-- 5. Cartão principal da interface de autenticação -->
    <main class="glass-card">
        <!-- 5.1. Conteúdo de autenticação ocultado quando a sessão fica ativa -->
        <div id="auth-shell">
            <!-- 5.1.1. Título e descrição atualizados ao alternar entre login e cadastro -->
            <header class="header">
                <h2 id="form-title">Bem-vindo de volta</h2>
                <p id="form-subtitle">Insira suas credenciais para acessar sua conta</p>
            </header>

            <!-- 5.1.2. Navegação por abas para alternar login e cadastro no mesmo cartão -->
            <div class="auth-tabs" role="tablist" aria-label="Formulários de autenticação">
                <button type="button" class="auth-tab active" id="login-tab" role="tab" aria-selected="true" aria-controls="login-form" tabindex="0">
                    Entrar
                </button>
                <button type="button" class="auth-tab" id="signup-tab" role="tab" aria-selected="false" aria-controls="signup-form" tabindex="-1">
                    Cadastrar
                </button>
            </div>

            <!-- 5.1.3. Área que sobrepõe e alterna os formulários de autenticação -->
            <div class="form-container">

                <!-- 5.3.1. Login: credenciais, opções auxiliares e envio -->
                <form id="login-form" class="auth-form active" role="tabpanel" aria-labelledby="login-tab" novalidate>

                <!-- Identificação da conta pelo e-mail cadastrado -->
                <div class="input-group">
                    <label for="login-email">E-mail</label>
                    <div class="input-wrapper">
                        <input type="text" id="login-email" class="input-field" placeholder="seu@email.com" autocomplete="email" maxlength="254" required>
                        <svg class="input-icon" viewBox="0 0 24 24">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </div>
                </div>

                <!-- Senha de acesso e controle para exibir ou ocultar o valor -->
                <div class="input-group">
                    <label for="login-password">Senha</label>
                    <div class="input-wrapper">
                        <input type="password" id="login-password" class="input-field has-toggle" placeholder="••••••••" autocomplete="current-password" maxlength="128" required>
                        <svg class="input-icon" viewBox="0 0 24 24">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <button type="button" class="toggle-password" aria-label="Mostrar/Ocultar Senha" data-target="login-password">
                            <svg class="eye-icon" viewBox="0 0 24 24">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Opções auxiliares: lembrar a sessão e iniciar recuperação de senha -->
                <div class="actions-row">
                    <label class="remember-me">
                        <input type="checkbox" id="remember-me">
                        <span>Lembrar-me</span>
                    </label>
                    <a href="#" class="forgot-link" id="forgot-password-link">Esqueceu a senha?</a>
                </div>

                <!-- Envio do login; o spinner indica a chamada à API -->
                <button type="submit" class="btn-submit">
                    <span class="btn-text">Entrar</span>
                    <div class="spinner"></div>
                </button>

                <!-- Navegação para o formulário de cadastro -->
                <div class="form-footer">
                    <span>Não tem uma conta?</span>
                    <a href="#" class="switch-link" id="goto-signup">Cadastre-se</a>
                </div>
                </form>

                <!-- 5.3.2. Cadastro: dados básicos e envio -->
                <form id="signup-form" class="auth-form" role="tabpanel" aria-labelledby="signup-tab" novalidate>

                <!-- Identificação da nova conta -->
                <div class="input-group">
                    <label for="signup-name">Nome Completo</label>
                    <div class="input-wrapper">
                        <input type="text" id="signup-name" class="input-field" placeholder="Seu nome" autocomplete="name" minlength="2" maxlength="80" required>
                        <svg class="input-icon" viewBox="0 0 24 24">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </div>
                </div>

                <!-- Endereço de e-mail da nova conta -->
                <div class="input-group">
                    <label for="signup-email">E-mail</label>
                    <div class="input-wrapper">
                        <input type="email" id="signup-email" class="input-field" placeholder="seu@email.com" autocomplete="email" maxlength="254" required>
                        <svg class="input-icon" viewBox="0 0 24 24">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                    </div>
                </div>

                <!-- Criação da senha, com controle para exibir ou ocultar o valor -->
                <div class="input-group">
                    <label for="signup-password">Criar Senha</label>
                    <div class="input-wrapper">
                        <input type="password" id="signup-password" class="input-field has-toggle" placeholder="Mínimo 8 caracteres" autocomplete="new-password" minlength="8" maxlength="128" required>
                        <svg class="input-icon" viewBox="0 0 24 24">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <button type="button" class="toggle-password" aria-label="Mostrar/Ocultar Senha" data-target="signup-password">
                            <svg class="eye-icon" viewBox="0 0 24 24">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Envio do cadastro; o spinner indica a chamada à API -->
                <button type="submit" class="btn-submit">
                    <span class="btn-text">Criar Conta</span>
                    <div class="spinner"></div>
                </button>

                <!-- Navegação de volta para o formulário de login -->
                <div class="form-footer">
                    <span>Já possui uma conta?</span>
                    <a href="#" class="switch-link" id="goto-login">Faça Login</a>
                </div>
                </form>

            </div>
        </div>

        <!-- 6. Área de conta: a API confirma a sessão e o botão pede logout ao backend -->
        <section class="account-panel" id="account-panel" hidden aria-live="polite">
            <h2 id="account-greeting">Sessão ativa</h2>
            <p>Você está conectado à sua conta.</p>
            <button type="button" class="btn-submit" id="logout-button">Sair</button>
        </section>
    </main>


</body>
</html>
